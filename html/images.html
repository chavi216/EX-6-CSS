<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT - Images</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/images.css">
</head>

<body>
    <header class="top-bar">
        <a class="logo" href="index.html">ChatGPT </a>


        <nav class="navigation" aria-label="Main navigation">
            <a href="index.html">Main</a>
            <a href="images.html">Images</a>
            <a href="agent.html">Agent</a>
        </nav>


        <section class="account-actions" aria-label="Account">
            <button type="button" class="login">Log in</button>
            <button type="button" class="signup">Sign up for free</button>
            <button type="button" class="help" aria-label="Help">?</button>
        </section>
    </header>

    <main class="content">
        <h1>Images</h1>

        <section class="gallery-section">
            <header class="section-header">
                <h2>Try a style on an image</h2>
                <span class="arrows" aria-hidden="true">‹　❯</span>
            </header>

            <section class="gallery" aria-label="Image styles">
                <figure>
                    <img src="https://picsum.photos/id/64/160/240" alt="Sketch style portrait">
                    <figcaption>Sketch</figcaption>
                </figure>

                <figure>
                    <img src="https://picsum.photos/id/91/160/240?grayscale" alt="Dramatic portrait">
                    <figcaption>Dramatic</figcaption>
                </figure>

                <figure>
                    <img src="https://picsum.photos/id/433/160/240" alt="Plushie style">
                    <figcaption>Plushie</figcaption>
                </figure>

                <figure>
                    <img src="https://picsum.photos/id/237/160/240" alt="Retro anime inspiration">
                    <figcaption>Retro anime</figcaption>
                </figure>

                <figure>
                    <img src="https://picsum.photos/id/1005/160/240" alt="Baseball bobblehead inspiration">
                    <figcaption>Baseball bobblehead</figcaption>
                </figure>

                <figure>
                    <img src="https://picsum.photos/id/1027/160/240?grayscale" alt="Doodle portrait">
                    <figcaption>Doodle</figcaption>
                </figure>
            </section>
        </section>

        <section class="discover">
            <header class="section-header">
                <h2>Discover something new</h2>
                <span class="arrows" aria-hidden="true">‹　❯</span>
            </header>

            <section class="discover-column">
                <article class="discover-item">
                    <img src="https://picsum.photos/id/65/80/80" alt="Portrait example">
                    <p>Me as The Girl with a Pearl</p>
                </article>

                <article class="discover-item">
                    <img src="https://picsum.photos/id/1011/80/80" alt="Background editing example">
                    <p>Remove people in the background</p>
                </article>

                <article class="discover-item">
                    <img src="https://picsum.photos/id/1005/80/80" alt="K-pop style example">
                    <p>What would I look like as a K-Pop star?</p>
                </article>
            </section>

            <section class="discover-column">
                <article class="discover-item">
                    <img src="https://picsum.photos/id/292/80/80" alt="Product photo">
                    <p>Create a professional product photo</p>
                </article>

                <article class="discover-item">
                    <img src="https://picsum.photos/id/1027/80/80" alt="Fashion style example">
                    <p>Style me</p>
                </article>

                <article class="discover-item">
                    <img src="https://picsum.photos/id/1062/80/80" alt="Keychain inspiration">
                    <p>Turn into a keychain</p>
                </article>
            </section>
        </section>
    </main>
</body>

</html>
